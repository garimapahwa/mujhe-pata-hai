<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --skin: #ffc9b5; --angry: #ff6b6b; --ink: #2e2c45; --accent: #c0485a; }
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none;
    font-family: "Kohinoor Devanagari", -apple-system, "Helvetica Neue", sans-serif; cursor: default; }
  #stage { position: relative; width: 300px; height: 380px; }

  /* ---------- speech bubble ---------- */
  #bubble { position: absolute; left: 12px; right: 12px; bottom: 236px; padding: 10px 14px; border-radius: 16px;
    background: #fffdf8; color: var(--ink); font-size: 15px; line-height: 1.35; font-weight: 600;
    box-shadow: 0 6px 18px rgba(0,0,0,.18); border: 2.5px solid #ffd166; opacity: 0; transform: translateY(8px) scale(.96);
    transition: opacity .25s, transform .25s, border-color .3s; pointer-events: none; }
  #bubble.show { opacity: 1; transform: none; }
  #bubble::after { content: ""; position: absolute; bottom: -12px; left: 50%; margin-left: -10px; border: 10px solid transparent;
    border-top-color: inherit; border-bottom: 0; }
  #bubble .you { display: block; margin-top: 6px; font-size: 12px; font-weight: 500; color: #6b7280; }
  .lvl-2 #bubble { border-color: #ff9f1c; }
  .lvl-3 #bubble { border-color: #ef233c; font-size: 16px; }

  /* ---------- chip (listening / snooze / distraction) ---------- */
  #chip { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); padding: 3px 10px; border-radius: 999px;
    font: 600 12px -apple-system, sans-serif; color: #fff; background: #111827cc; white-space: nowrap; opacity: 0; transition: opacity .2s; }
  #chip.show { opacity: 1; }
  #micbar { display: inline-block; vertical-align: middle; width: 46px; height: 6px; margin-left: 6px; border-radius: 3px; background: #ffffff33; overflow: hidden; }
  #micfill { height: 100%; width: 0; background: #4ade80; transition: width .08s; }

  /* ---------- character ---------- */
  #char { position: absolute; left: 50px; bottom: 26px; width: 200px; height: 200px; cursor: grab; overflow: visible; }
  #char:active { cursor: grabbing; }
  #all { transform-origin: 100px 190px; animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  .nagging #all { animation: shake .35s ease-in-out infinite; }
  .nagging.lvl-2 #all { animation-duration: .22s; }
  .nagging.lvl-3 #all { animation: shake3 .14s linear infinite; }
  @keyframes shake { 25% { transform: translateX(-2px) rotate(-1deg); } 75% { transform: translateX(2px) rotate(1deg); } }
  @keyframes shake3 { 25% { transform: translateX(-5px) rotate(-2.5deg); } 75% { transform: translateX(5px) rotate(2.5deg); } }

  .skin { fill: var(--skin); stroke: var(--ink); stroke-width: 2.5; transition: fill .4s; filter: url(#grain); }
  .lvl-3.nagging #body, .lvl-3.nagging .arm .skin { fill: var(--angry); }
  .stroke { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
  .brow { transform-box: fill-box; transform-origin: center; transition: transform .25s; }
  .nagging #browL, .busted #browL { transform: translateY(3px) rotate(18deg); }
  .nagging #browR, .busted #browR { transform: translateY(3px) rotate(-18deg); }
  .snoozed #browL { transform: translateY(-3px) rotate(-8deg); }
  .snoozed #browR { transform: translateY(4px) rotate(10deg); }

  #eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .pupil { transition: transform .3s; }
  .snoozed .pupil { transform: translateX(5px) scaleY(.55); }
  .working .pupil { transform: translate(3px, 2px); }
  .eye-shine { fill: #fff; }

  .mouth { opacity: 0; transition: opacity .15s; }
  .working #mSmile, .idle-state #mFlat, .snoozed #mFlat, .thinking #mO, .listening #mO, .nagging #mFrown { opacity: 1; }
  .speaking .mouth { opacity: 0 !important; }
  .speaking #mTalk { opacity: 1 !important; animation: talk .16s ease-in-out infinite alternate; }
  #mTalk { transform-box: fill-box; transform-origin: center; }
  @keyframes talk { from { transform: scaleY(.35); } to { transform: scaleY(1.15); } }

  .arm { transform-box: fill-box; transition: transform .35s; }
  #armR { transform-origin: 20% 20%; }
  #armL { transform-origin: 80% 20%; }
  .listening #armR { transform: translate(-12px, -44px) rotate(-35deg); }
  .nagging.lvl-3 #armL { transform: translate(-4px, -30px) rotate(25deg); }
  .nagging.lvl-3 #armR { transform: translate(4px, -30px) rotate(-25deg); }

  /* listening waves */
  #waves { opacity: 0; transition: opacity .2s; }
  .listening #waves { opacity: 1; }
  .wave { fill: none; stroke: #22c55e; stroke-width: 3; stroke-linecap: round; animation: wave 1s ease-out infinite; }
  .wave:nth-child(2) { animation-delay: .25s; }
  @keyframes wave { from { opacity: 1; } to { opacity: .1; } }

  /* thinking dots */
  #dots { opacity: 0; } .thinking #dots { opacity: 1; }
  #dots circle { fill: #9ca3af; animation: dot 1s infinite; }
  #dots circle:nth-child(2) { animation-delay: .15s; } #dots circle:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 50% { transform: translateY(-5px); fill: #4b5563; } }

  /* steam at level 3 */
  #steam { opacity: 0; } .nagging.lvl-3 #steam { opacity: 1; }
  .puff { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 2; animation: puff 1s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .puff:nth-child(2) { animation-delay: .5s; }
  @keyframes puff { from { transform: translateY(0) scale(.6); opacity: 1; } to { transform: translateY(-22px) scale(1.2); opacity: 0; } }

  /* zzz-ish suspicious hourglass while snoozed */
  #hourglass { opacity: 0; font-size: 26px; } .snoozed #hourglass { opacity: 1; }

  /* accessories per persona */
  .acc { display: none; }
  .p-mummy .acc-mummy, .p-dost .acc-dost, .p-commentator .acc-commentator, .p-filmy .acc-filmy, .p-action .acc-action { display: inline; }
  #belan { opacity: 0; transition: opacity .2s; }
  .p-mummy.nagging.lvl-2 #belan, .p-mummy.nagging.lvl-3 #belan { opacity: 1; }

  /* lie stamp */
  #stamp { position: absolute; left: 40px; bottom: 34px; padding: 4px 12px; border: 4px solid #ef233c; border-radius: 8px;
    color: #ef233c; font-size: 26px; font-weight: 800; background: #fff8; transform: rotate(-14deg) scale(2); opacity: 0;
    transition: opacity .2s, transform .25s cubic-bezier(.2, 1.6, .5, 1); pointer-events: none; }
  .busted #stamp { opacity: 1; transform: rotate(-14deg) scale(1); }

  /* ---------- minimal mode: just the character + a plain bubble ---------- */
  #stage { width: 240px; height: 260px; }
  #char { left: 60px; bottom: 4px; width: 120px; height: 120px; }
  #bubble { left: 8px; right: 8px; bottom: 132px; padding: 8px 12px; border-radius: 12px; font-size: 14px; font-weight: 500;
    background: #fff; color: #111; border: 1px solid #e5e5e5; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  #bubble::after { border-top-color: #fff; }
  .lvl-2 #bubble, .lvl-3 #bubble { border-color: #e5e5e5; font-size: 14px; }
  #bubble .you, #chip, #stamp, #hourglass, #waves, #dots, #steam, #belan { display: none !important; }

  /* ---------- illustrated look: flat eyes, heavy-lidded "मुझे पता है" stare, grain ---------- */
  .eye-shine { display: none; }
  .lid-fill { fill: var(--skin); transition: fill .4s; }
  .lvl-3.nagging .lid-fill { fill: var(--angry); }
  .lid-line { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; }
  #lids { transition: transform .25s; }
  .nagging #lids, .busted #lids { transform: translateY(-7px); }
  .listening #lids { transform: translateY(-5px); }
  .thinking #lids { transform: translateY(-3px); }
  .snoozed #lids { transform: translateY(2px); }
  #bubble { background: #f6efe9; color: #2e2c45; border: 2px solid #2e2c45; border-radius: 10px; box-shadow: none; font-weight: 500; }
  #bubble::after { border-top-color: #2e2c45; }
  .lvl-2 #bubble, .lvl-3 #bubble { border-color: #2e2c45; }
</style>
</head>
<body>
<div id="stage" class="p-mummy working lvl-1">
  <div id="bubble"><span id="say"></span><span class="you" id="you"></span></div>

  <svg id="char" viewBox="0 0 200 200">
    <defs><filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .18  0 0 0 0 .17  0 0 0 0 .27  0 0 0 .22 0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="gi"/></feMerge>
    </filter></defs>
    <g id="all">
      <ellipse cx="100" cy="194" rx="56" ry="6" fill="#2e2c4520"/>

      <!-- behind the body -->
      <g class="acc acc-mummy"><circle cx="100" cy="50" r="19" fill="#2e2c45" stroke="#2e2c45" stroke-width="3"/>
        <circle cx="113" cy="40" r="4" fill="#e3a07a"/></g>
      <g class="acc acc-filmy"><path d="M30 150 Q100 205 170 150 L176 176 Q100 214 24 176 Z" fill="#a58aae" stroke="#2e2c45" stroke-width="3"/></g>

      <g id="armL" class="arm"><ellipse class="skin" cx="34" cy="142" rx="14" ry="19"/></g>
      <g id="armR" class="arm">
        <ellipse class="skin" cx="166" cy="142" rx="14" ry="19"/>
        <g id="belan" class="acc acc-mummy"><rect x="150" y="96" width="12" height="54" rx="6" fill="#d9b48c" stroke="#2e2c45" stroke-width="3" transform="rotate(25 156 123)"/></g>
      </g>

      <path id="body" class="skin" d="M100 56 C150 56 172 98 172 136 C172 174 140 190 100 190 C60 190 28 174 28 136 C28 98 50 56 100 56 Z"/>

      <!-- hair / headwear -->
      <g class="acc acc-mummy"><path d="M48 92 C52 62 80 54 100 56 C122 54 150 62 152 92 C134 76 116 74 100 76 C84 74 66 76 48 92 Z" fill="#2e2c45"/></g>
      <g class="acc acc-filmy"><path d="M46 92 C50 58 84 52 104 56 C132 56 154 70 154 96 C140 80 122 72 98 74 C80 76 62 80 46 92 Z" fill="#2e2c45"/></g>
      <g class="acc acc-dost">
        <path d="M44 82 C52 52 148 52 156 82 Z" fill="#d48c93" stroke="#2e2c45" stroke-width="3"/>
        <rect x="132" y="74" width="40" height="9" rx="4" fill="#d48c93" stroke="#2e2c45" stroke-width="3"/>
      </g>
      <g class="acc acc-action">
        <rect x="34" y="78" width="132" height="13" rx="5" fill="#c96a71" stroke="#2e2c45" stroke-width="3"/>
        <path d="M164 84 L186 74 L182 92 Z M164 86 L188 100 L174 104 Z" fill="#c96a71" stroke="#2e2c45" stroke-width="2.5"/>
      </g>
      <g class="acc acc-commentator">
        <path d="M40 120 C36 60 164 60 160 120" fill="none" stroke="#2e2c45" stroke-width="6"/>
        <rect x="30" y="108" width="16" height="28" rx="6" fill="#8796bb" stroke="#2e2c45" stroke-width="3"/>
        <rect x="154" y="108" width="16" height="28" rx="6" fill="#8796bb" stroke="#2e2c45" stroke-width="3"/>
        <path d="M40 132 Q50 160 80 156" fill="none" stroke="#2e2c45" stroke-width="4"/><circle cx="82" cy="156" r="6" fill="#2e2c45"/>
      </g>

      <!-- face -->
      <g id="eyes">
        <g class="pupil"><ellipse cx="78" cy="114" rx="8" ry="10" fill="#2e2c45"/><circle class="eye-shine" cx="81" cy="110" r="2.6"/></g>
        <g class="pupil"><ellipse cx="122" cy="114" rx="8" ry="10" fill="#2e2c45"/><circle class="eye-shine" cx="125" cy="110" r="2.6"/></g>
      </g>
      <g id="lids">
        <rect class="lid-fill" x="67" y="100" width="22" height="10"/><path class="lid-line" d="M68.5 110 Q78 108.5 87.5 110"/>
        <rect class="lid-fill" x="111" y="100" width="22" height="10"/><path class="lid-line" d="M112.5 110 Q122 108.5 131.5 110"/>
      </g>
      <path id="browL" class="brow stroke" d="M64 98 Q76 91 88 97"/>
      <path id="browR" class="brow stroke" d="M112 97 Q124 91 136 98"/>
      <g class="acc acc-mummy" fill="none" stroke="#2e2c45" stroke-width="2.4">
        <circle cx="78" cy="114" r="14"/><circle cx="122" cy="114" r="14"/><path d="M92 112 Q100 107 108 112"/>
      </g>
      <g class="acc acc-dost"><rect x="62" y="86" width="30" height="11" rx="5" fill="#2e2c45"/><rect x="108" y="86" width="30" height="11" rx="5" fill="#2e2c45"/><path d="M92 91 L108 91" stroke="#2e2c45" stroke-width="3"/></g>
      <ellipse cx="62" cy="132" rx="9" ry="6" fill="#d9828b" opacity=".42"/>
      <ellipse cx="138" cy="132" rx="9" ry="6" fill="#d9828b" opacity=".42"/>
      <circle class="acc acc-mummy" cx="100" cy="91" r="4" fill="#c0485a"/>

      <path id="mSmile" class="mouth stroke" d="M86 140 Q100 152 114 140"/>
      <path id="mFlat" class="mouth stroke" d="M88 145 L112 143"/>
      <path id="mFrown" class="mouth stroke" d="M86 149 Q100 137 114 149"/>
      <ellipse id="mO" class="mouth" cx="100" cy="145" rx="6" ry="7" fill="#2e2c45"/>
      <ellipse id="mTalk" class="mouth" cx="100" cy="145" rx="11" ry="9" fill="#8c3f4a" stroke="#2e2c45" stroke-width="3"/>
      <g class="acc acc-filmy"><path d="M78 134 Q90 126 100 133 Q110 126 122 134 Q112 140 100 136 Q88 140 78 134 Z" fill="#2e2c45"/></g>

      <!-- effects -->
      <g id="waves"><path class="wave" d="M182 92 Q190 102 182 112"/><path class="wave" d="M190 84 Q202 102 190 120"/></g>
      <g id="dots"><circle cx="152" cy="62" r="5"/><circle cx="166" cy="54" r="5"/><circle cx="180" cy="46" r="5"/></g>
      <g id="steam"><circle class="puff" cx="62" cy="54" r="9"/><circle class="puff" cx="140" cy="52" r="9"/></g>
      <text id="hourglass" x="150" y="62">⏳</text>
    </g>
  </svg>

  <div id="stamp">मुझे पता है!</div>
  <div id="chip"><span id="chiptext"></span><span id="micbar" style="display:none"><span id="micfill" style="display:block"></span></span></div>
</div>

<script>
  const SKIN = { mummy: "#e8b593", dost: "#b3b4d9", commentator: "#bccdb0", filmy: "#e2c08f", action: "#dd9a92" };
  const stage = document.getElementById("stage");
  let lastText = "", textShownAt = 0, bustedUntil = 0;

  // Called from Python with a plain object.
  function update(s) {
    const cls = ["p-" + s.persona, "lvl-" + s.level];
    const st = s.state;
    if (st === "WORKING") cls.push("working");
    if (st === "IDLE") cls.push("idle-state", "nagging");
    if (st === "NAGGING") cls.push("nagging");
    if (st === "LISTENING") cls.push("listening");
    if (st === "RESPONDING") cls.push("thinking");
    if (st === "SNOOZED") cls.push("snoozed");
    if (s.speaking) cls.push("speaking");
    if (s.busted) bustedUntil = Date.now() + 2600;
    if (Date.now() < bustedUntil) cls.push("busted");
    stage.className = cls.join(" ");
    document.documentElement.style.setProperty("--skin", SKIN[s.persona] || SKIN.mummy);

    // bubble: show the latest line while engaged; in WORKING keep it ~5s then fade
    const bubble = document.getElementById("bubble");
    if (s.text !== lastText) { lastText = s.text; textShownAt = Date.now(); }
    document.getElementById("say").textContent = s.text || "";
    document.getElementById("you").textContent = s.heard ? "तुम: " + s.heard : "";
    const engaged = st !== "WORKING";
    bubble.classList.toggle("show", !!s.text && (engaged || Date.now() - textShownAt < 5000));

    // chip
    const chip = document.getElementById("chip"), chiptext = document.getElementById("chiptext"), micbar = document.getElementById("micbar");
    let label = "";
    micbar.style.display = "none";
    if (st === "LISTENING") { label = "🎙 बोलो…"; micbar.style.display = "inline-block"; document.getElementById("micfill").style.width = Math.round(s.mic * 100) + "%"; }
    else if (st === "SNOOZED" && s.countdown > 0) label = "⏳ " + s.countdown.toFixed(0) + "s";
    else if (s.distraction) label = "🚨 " + s.distraction;
    else if (s.idle > s.threshold * 0.5 && st === "WORKING") label = "👀 " + s.idle.toFixed(0) + "s idle";
    chiptext.textContent = label;
    chip.classList.toggle("show", !!label);
  }

  // drag the buddy around: send deltas to Python, which moves the window
  const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.buddy;
  let drag = null;
  document.getElementById("char").addEventListener("mousedown", e => { drag = { x: e.screenX, y: e.screenY }; });
  window.addEventListener("mousemove", e => {
    if (!drag || !native) return;
    const dx = e.screenX - drag.x, dy = e.screenY - drag.y;
    drag = { x: e.screenX, y: e.screenY };
    native.postMessage({ dx, dy });
  });
  window.addEventListener("mouseup", () => { if (drag && native) native.postMessage({ dropped: true }); drag = null; });

  // ---- website embedding: ?persona=mummy[&loop=1], and postMessage({say, level, state}) from the page ----
  const q = new URLSearchParams(location.search);
  if (q.has("persona")) {
    const base = { persona: q.get("persona"), state: "WORKING", level: 1, speaking: false, text: "", heard: "", mic: 0,
                   countdown: 0, distraction: "", idle: 0, threshold: 8, busted: false };
    update(base);
    const SCRIPT = [
      [2600, { state: "WORKING" }],
      [900,  { state: "IDLE", distraction: "YouTube" }],
      [3200, { state: "NAGGING", speaking: true, distraction: "YouTube", text: "बेटा, Taarak Mehta देख रही हो? मुझे पता है!" }],
      [2600, { state: "LISTENING", mic: .55, text: "बेटा, Taarak Mehta देख रही हो? मुझे पता है!" }],
      [1100, { state: "RESPONDING", heard: "नहीं नहीं, पढ़ रही हूँ", text: "बेटा, Taarak Mehta देख रही हो? मुझे पता है!" }],
      [3200, { state: "NAGGING", level: 2, speaking: true, busted: true, distraction: "YouTube", text: "पढ़ाई? Screen पे तो Taarak Mehta चल रहा है!" }],
      [2600, { state: "LISTENING", level: 2, mic: .7, text: "पढ़ाई? Screen पे तो Taarak Mehta चल रहा है!" }],
      [3000, { state: "RESPONDING", level: 2, speaking: true, heard: "sorry sorry…", text: "चलो, सच तो बोला! वापस काम पे।" }],
      [3000, { state: "WORKING", text: "चलो, सच तो बोला! वापस काम पे।" }],
    ];
    let i = 0, timer = null;
    const step = () => { const [ms, s] = SCRIPT[i]; update({ ...base, ...s }); i = (i + 1) % SCRIPT.length; timer = setTimeout(step, ms); };
    if (q.get("loop") === "1") step();
    window.addEventListener("message", e => {
      if (!e.data || typeof e.data !== "object") return;
      clearTimeout(timer);
      update({ ...base, ...e.data });
    });
  }
</script>
</body>
</html>
