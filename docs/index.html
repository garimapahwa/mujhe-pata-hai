<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>मुझे पता है</title>
<meta name="description" content="Your Mac's Hinglish focus buddy.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👀</text></svg>">
<style>
  :root { --bg: #fff; --fg: #111; --muted: #888; --box: #f4f4f4; --line: #e5e5e5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #777; --box: #1d1d1d; --line: #2a2a2a; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center;
    background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Kohinoor Devanagari", sans-serif; }
  main { width: 100%; max-width: 600px; padding: 24px 20px; text-align: center; }
  h1 { font-size: 44px; font-weight: 600; margin: 0; }
  p { color: var(--muted); margin: 6px 0 36px; }
  .cmd { display: flex; align-items: center; gap: 10px; background: var(--box); border-radius: 10px; padding: 12px 12px 12px 16px; text-align: left; }
  .cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font: 14px ui-monospace, Menlo, monospace; scrollbar-width: none; }
  button { font: inherit; color: var(--fg); background: none; cursor: pointer; }
  .copy { flex: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; font-size: 13px; }
  .voices { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; margin-top: 28px; }
  .voices button { border: 0; padding: 0; font-size: 15px; color: var(--muted); }
  .voices button:hover, .voices button.on { color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>मुझे पता है</h1>
  <p>your Mac's Hinglish focus buddy</p>
  <div class="cmd"><code id="cmd">curl -fsSL https://garimapahwa.github.io/mujhe-pata-hai/install.sh | bash</code><button class="copy" id="copy">Copy</button></div>
  <div class="voices">
    <button data-src="audio/mummy.mp3">▶ Mummy</button>
    <button data-src="audio/dost.mp3">▶ Dost</button>
    <button data-src="audio/commentator.mp3">▶ Commentator</button>
    <button data-src="audio/filmy.mp3">▶ Filmy</button>
    <button data-src="audio/action.mp3">▶ Action</button>
  </div>
</main>
<script>
  const audio = new Audio();
  let current = null;
  const reset = () => { if (current) { current.classList.remove("on"); current.textContent = current.textContent.replace("■", "▶"); } current = null; };
  document.querySelectorAll(".voices button").forEach(b => b.addEventListener("click", () => {
    if (current === b) { audio.pause(); reset(); return; }
    reset(); audio.src = b.dataset.src; audio.play();
    b.classList.add("on"); b.textContent = b.textContent.replace("▶", "■"); current = b;
  }));
  audio.addEventListener("ended", reset);
  document.getElementById("copy").addEventListener("click", async e => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText(document.getElementById("cmd").textContent); b.textContent = "Copied"; } catch { b.textContent = "⌘C"; }
    setTimeout(() => (b.textContent = "Copy"), 1500);
  });
</script>
</body>
</html>
